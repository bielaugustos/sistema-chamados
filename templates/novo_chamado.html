{% extends "base.html" %}
{% block conteudo %}
<h2>Abrir chamado</h2>
<form method="POST">
  <label>Solicitante</label>
  <input type="text" name="solicitante" required>
  <label>Título</label>
  <input type="text" name="titulo" required>
  <label>Descrição</label>
  <textarea name="descricao" required></textarea>
  <label>Prioridade</label>
  <select name="prioridade">
    <option value="BAIXA">
      Baixa
    </option>
    <option value="MEDIA">
      Média
    </option>
    <option value="ALTA">
      Alta
    </option>
  </select>
  <button type="submit">
    Abrir chamado
  </button>
</form>
{% endblock %}
